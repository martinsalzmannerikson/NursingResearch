[build]
  command = "npm run normalize && npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."update-latest"]
  schedule = "0 5 * * *"

[[redirects]]
  from = "/api/resolve-sources"
  to = "/api-disabled.json"
  status = 404
  force = true

[[redirects]]
  from = "/api/latest"
  to = "/.netlify/functions/latest"
  status = 200

[[redirects]]
  from = "/api/status"
  to = "/.netlify/functions/status"
  status = 200

[[redirects]]
  from = "/api/journal-latest"
  to = "/.netlify/functions/journal-latest"
  status = 200

[[redirects]]
  from = "/api/refresh"
  to = "/.netlify/functions/refresh"
  status = 200

[[redirects]]
  from = "/api/start-summary-job"
  to = "/.netlify/functions/start-summary-job"
  status = 200

[[redirects]]
  from = "/api/process-summary-background"
  to = "/.netlify/functions/process-summary-background"
  status = 200

[[redirects]]
  from = "/api/get-summary-status"
  to = "/.netlify/functions/get-summary-status"
  status = 200

[[redirects]]
  from = "/api/download-summary-pdf"
  to = "/.netlify/functions/download-summary-pdf"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
