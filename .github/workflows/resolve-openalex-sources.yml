name: Resolve OpenAlex Sources

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
      OPENALEX_RESOLVE_DELAY_MS: ${{ vars.OPENALEX_RESOLVE_DELAY_MS || '750' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Normalize journal manifest
        run: npm run normalize

      - name: Resolve OpenAlex source map
        run: npm run resolve:sources

      - name: Commit resolved source map
        run: |
          if git diff --quiet -- src/data/journals.json src/data/openalex-source-map.json src/data/unresolved-journals.csv; then
            echo "No source-map changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/journals.json src/data/openalex-source-map.json src/data/unresolved-journals.csv
          git commit -m "Update OpenAlex source map"
          git push
